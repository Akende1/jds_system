{% extends 'base_frontend.html' %}
{% block content %}
  <h2>Promote {{ staff.user.get_full_name }}</h2>
  <p>Are you sure you want to promote <strong>{{ staff.user.get_full_name }}</strong> to Head Teacher?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary">Confirm Promotion</button>
    <a href="{% url 'frontend:staff_detail' staff.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
