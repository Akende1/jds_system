{% extends 'base_frontend.html' %}

{% block content %}
<div class="container mt-4">
  <h2>Add Staff Member</h2>
  <p class="text-muted">Create the account, send the onboarding link, and let the staff member complete their login setup.</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">First name</label>
        <input type="text" name="first_name" class="form-control">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Last name</label>
        <input type="text" name="last_name" class="form-control">
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">User type</label>
        <select name="user_type" class="form-select">
          {% for ut in user_types %}
          <option value="{{ ut }}">{{ ut|capfirst }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Staff type</label>
        <select name="staff_type" class="form-select">
          {% for value, label in staff_types %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Employment type</label>
      <select name="employment_type" class="form-select">
        {% for value, label in employment_types %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <hr>
    <h5>Staff details</h5>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Staff ID</label>
        <input type="text" name="staff_id" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Department</label>
        <select name="department" class="form-select">
          {% for dept in departments %}
          <option value="{{ dept }}">{{ dept }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Designation</label>
        <input type="text" name="designation" class="form-control" required>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Date of Joining</label>
        <input type="date" name="date_of_joining" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Qualification</label>
        <input type="text" name="qualification" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Experience Years</label>
        <input type="number" min="0" name="experience_years" class="form-control" value="0">
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Gender</label>
        <select name="gender" class="form-select">
          {% for value, label in genders %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Marital Status</label>
        <input type="text" name="marital_status" class="form-control" placeholder="Single, Married...">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">TPIN Number</label>
        <input type="text" name="tpin_no" class="form-control">
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">NRC Number</label>
        <input type="text" name="nrc_no" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Bank Name</label>
        <input type="text" name="bank_name" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Account Number</label>
        <input type="text" name="account_number" class="form-control">
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Add staff</button>
  </form>
</div>
{% endblock %}
