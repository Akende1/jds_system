{% extends 'base_frontend.html' %}

{% block title %}Record Payment - School Management System{% endblock %}

{% block page_title %}Record Payment{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">Record Payment</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Student / Invoice</label>
                        <select name="invoice_id" class="form-select" required id="invoiceSelect">
                            <option value="">Select Invoice...</option>
                            {% for invoice in pending_invoices %}
                            <option value="{{ invoice.id }}" data-balance="{{ invoice.balance }}" {% if selected_invoice_id == invoice.id|stringformat:'s' %}selected{% endif %}>
                                {{ invoice.invoice_number }} - {{ invoice.student.get_full_name }} 
                                (Balance: K {{ invoice.balance|floatformat:2 }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Outstanding Balance</label>
                        <div class="form-control-plaintext fw-bold text-danger" id="balanceDisplay">
                            Select an invoice
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Amount Paying</label>
                        <div class="input-group">
                            <span class="input-group-text">K</span>
                            <input type="number" name="amount" class="form-control" step="0.01" min="0.01" required id="amountInput">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="payment_method" class="form-select" required>
                            <option value="cash">Cash</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="mobile_money">Mobile Money</option>
                            <option value="cheque">Cheque</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Payment Date</label>
                        <input type="date" name="payment_date" class="form-control" value="{{ today|date:'Y-m-d' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Reference Number (Optional)</label>
                        <input type="text" name="reference_number" class="form-control" placeholder="Transaction ID, Cheque #, etc.">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Notes (Optional)</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label d-block">Send After Saving</label>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="send_receipt_email" id="sendReceiptEmail" checked>
                            <label class="form-check-label" for="sendReceiptEmail">
                                Email the receipt to the parent/guardian
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="send_confirmation_sms" id="sendConfirmationSms">
                            <label class="form-check-label" for="sendConfirmationSms">
                                Send a payment confirmation SMS
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-cash-coin"></i> Record Payment & Generate Receipt
                        </button>
                        <a href="{% url 'frontend:payment_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Update balance display when invoice is selected
    document.getElementById('invoiceSelect').addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        const balance = selectedOption.getAttribute('data-balance');
        
        if (balance) {
            document.getElementById('balanceDisplay').textContent = 'K ' + parseFloat(balance).toFixed(2);
            document.getElementById('amountInput').setAttribute('max', balance);
        } else {
            document.getElementById('balanceDisplay').textContent = 'Select an invoice';
            document.getElementById('amountInput').removeAttribute('max');
        }
    });

    document.getElementById('invoiceSelect').dispatchEvent(new Event('change'));
</script>
{% endblock %}
